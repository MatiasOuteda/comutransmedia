<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Reemplazo o complemento? El vínculo con las mascotas en la Argentina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
<style>
  :root{
    --bg: #EEF0EC;
    --panel: #FBFAF7;
    --ink: #1D2521;
    --ink-soft: #55605B;
    --rose: #B85C6B;
    --rose-soft: #E3B7BE;
    --teal: #2C6E68;
    --teal-soft: #AFD1CC;
    --gold: #D9A441;
    --line: #D8D9D0;
    --radius: 14px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{ font-family:'Fraunces', serif; font-weight:600; margin:0; }
  a{ color:var(--teal); text-decoration:underline; }
  a:hover{ color:var(--rose); }

  [hidden] { display: none !important; }

  #loading, #error{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:2rem;
    gap:1rem;
  }
  .spinner{
    width:40px; height:40px;
    border-radius:50%;
    border:3px solid var(--line);
    border-top-color:var(--rose);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loading p, #error p{ color:var(--ink-soft); max-width:32em; }
  #error h2{ color:var(--rose); }
  #retryBtn{
    font-family:'Inter', sans-serif;
    font-size:0.95rem;
    font-weight:600;
    color:var(--panel);
    background:var(--teal);
    border:none;
    padding:0.7rem 1.4rem;
    border-radius:8px;
    cursor:pointer;
  }
  #retryBtn:hover{ background:#245853; }

  #dashboard{ max-width:1180px; margin:0 auto; padding:3.5rem 1.75rem 5rem; }

  header.hero{ margin-bottom:2.75rem; }
  .kicker{ color:var(--rose); font-weight:600; font-size:0.95rem; margin-bottom:0.6rem; }
  h1.title{
    font-size:clamp(2rem, 4.4vw, 3.1rem);
    line-height:1.12;
    max-width:16.5em;
    letter-spacing:-0.01em;
  }
  h1.title em{ font-style:italic; color:var(--rose); }
  .bajada{
    margin-top:1.1rem;
    max-width:48em;
    font-size:1.15rem;
    color:var(--ink-soft);
  }

  /* ---------- Índice / introducción estructural ---------- */
  .intro-index{
    margin-top:2.2rem;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
    gap:1.1rem;
    max-width:64em;
  }
  .intro-item{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:4px solid var(--rose);
    border-radius:10px;
    padding:1.1rem 1.3rem;
  }
  .intro-item:nth-child(2){ border-left-color:var(--teal); }
  .intro-item:nth-child(3){ border-left-color:var(--gold); }
  .intro-item .num{
    font-family:'Fraunces', serif;
    font-size:0.85rem;
    font-weight:600;
    color:var(--ink-soft);
    letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .intro-item h4{
    font-family:'Fraunces', serif;
    font-size:1.08rem;
    font-weight:600;
    margin:0.35rem 0 0.45rem;
    color:var(--ink);
  }
  .intro-item p{ margin:0; font-size:0.92rem; color:var(--ink-soft); line-height:1.45; }

  /* ---------- Pelotas y Hueso Metodológico ---------- */
  .methodology-wrapper {
    display: grid;
    grid-template-columns: 1fr;
    gap: 4rem;
    margin-top: 3.5rem;
    border-top: 1px solid var(--line);
    padding-top: 3rem;
  }
  @media (min-width: 900px) {
    .methodology-wrapper {
      grid-template-columns: 3fr 2fr;
      align-items: center;
    }
  }

  .methodology-list {
    display: flex;
    flex-direction: column;
    gap: 2.5rem;
  }
  .method-item {
    display: flex;
    align-items: center;
    gap: 2rem;
  }
  .toy-ball {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-family: 'Fraunces', serif;
    font-size: 2.4rem;
    font-weight: 600;
    color: var(--panel);
    box-shadow: inset -15px -15px 25px rgba(0,0,0,0.15), 0 12px 20px rgba(0,0,0,0.08);
    animation: float 3.5s ease-in-out infinite;
  }
  .ball-1 { background: radial-gradient(circle at 30% 30%, #43968E, var(--teal)); }
  .ball-2 { background: radial-gradient(circle at 30% 30%, #D67283, var(--rose)); animation-delay: -1s; }
  .ball-3 { background: radial-gradient(circle at 30% 30%, #F5C263, var(--gold)); animation-delay: -2s; }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  .method-text h3 { margin: 0 0 0.4rem; font-size: 1.25rem; color: var(--ink); }
  .method-text p { margin: 0; font-size: 1rem; color: var(--ink-soft); max-width: 50ch; line-height: 1.5; }

  /* Hueso de Juguete */
  .bone-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 2.5rem 2rem;
    background: var(--panel);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
  }
  .toy-bone {
    position: relative;
    width: 170px;
    height: 60px;
    background: var(--rose);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-size: 2.6rem;
    font-weight: 600;
    color: white;
    margin: 1.5rem auto 3.5rem;
    filter: drop-shadow(0 12px 15px rgba(0,0,0,0.15));
    animation: float 4s ease-in-out infinite;
    animation-delay: -1.5s;
  }
  .toy-bone::before, .toy-bone::after {
    content: '';
    position: absolute;
    width: 50px;
    height: 50px;
    background: var(--rose);
    border-radius: 50%;
    z-index: -1;
  }
  .toy-bone::before { left: -20px; top: -12px; box-shadow: 0 34px 0 var(--rose); }
  .toy-bone::after { right: -20px; top: -12px; box-shadow: 0 34px 0 var(--rose); }
  .bone-wrapper h3 { font-size: 1.3rem; color: var(--ink); margin: 0 0 0.5rem; }
  .bone-wrapper p { font-size: 1rem; color: var(--ink-soft); margin: 0; line-height: 1.5; }

  @media (max-width: 900px) {
    .method-item { flex-direction: column; text-align: center; gap: 1rem; }
    .method-text p { max-width: 100%; }
    .toy-bone { width: 150px; font-size: 2.4rem; }
  }

  section.block{ margin-top:3.4rem; }
  .block h2{ font-size:1.5rem; max-width:32em; }
  .block .q{ color:var(--rose); font-weight:500; font-family:'Inter',sans-serif; font-size:1rem; margin-bottom:0.5rem; display:block; }
  .block p.insight{ margin-top:0.9rem; max-width:64ch; color:var(--ink-soft); font-size:1rem; }
  .block p.insight strong{ color:var(--ink); font-weight:600; }
  .block p.method-note{
    margin-top:0.9rem;
    max-width:66ch;
    color:var(--ink-soft);
    font-size:0.95rem;
    background:#F4F5F0;
    border-left:3px solid var(--teal-soft);
    padding:0.85rem 1.1rem;
    border-radius:0 8px 8px 0;
  }
  .block p.method-note strong{ color:var(--ink); font-weight:600; }

  .chart-grid{
    margin-top:1.4rem;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(360px, 1fr));
    gap:1.25rem;
  }
  .chart-grid.single{ grid-template-columns:1fr; }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:1.4rem 1.5rem 1.1rem;
  }
  .panel h3{ font-size:1.05rem; font-weight:600; }
  .panel .sub{ color:var(--ink-soft); font-size:0.88rem; margin-top:0.2rem; }
  .chart-wrap{ position:relative; height:300px; width:100%; margin-top:1rem; }
  .chart-wrap.tall{ height:340px; }

  .international-box{
    margin-top:1.25rem;
    background:#F4F5F0;
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:1.2rem 1.4rem;
  }
  .international-box h4{ margin:0 0 0.4rem; font-size:0.95rem; color:var(--teal); font-weight:600; }
  .international-box p{ margin:0; font-size:0.9rem; color:var(--ink-soft); }
  .stat-triad{ display:flex; gap:1.5rem; margin-top:0.8rem; flex-wrap:wrap; }
  .stat-item{
    background:var(--panel);
    border:1px solid var(--line);
    padding:0.6rem 1rem;
    border-radius:8px;
    flex:1 1 120px;
  }
  .stat-item .val{ font-size:1.3rem; font-family:'Fraunces', serif; font-weight:600; color:var(--rose); }
  .stat-item .tag{ font-size:0.8rem; color:var(--ink-soft); }

  /* Ajuste visual limpio para la tarjeta del porcentaje */
  .quali-layout {
    display: flex;
    justify-content: center;
    margin-top: 1.5rem;
  }
  .highlight-card {
    background: var(--rose-soft);
    border-radius: var(--radius);
    padding: 3rem 2rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    border: 1px solid rgba(184, 92, 107, 0.3);
    max-width: 450px;
    width: 100%;
  }
  .highlight-card .big-num { font-family: 'Fraunces', serif; font-size: 6rem; color: #7A3542; font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
  .highlight-card .big-txt { font-size: 1.25rem; color: #7A3542; font-weight: 600; margin-top: 0.5rem; line-height: 1.2; }
  .highlight-card .big-sub { font-size: 1rem; margin-top: 1.5rem; color: #7A3542; opacity: 0.85; line-height: 1.4; }

  /* ---------- Ejemplos textuales (comentarios filtrados) ---------- */
  .quote-examples{
    margin-top:1.8rem;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
    gap:1rem;
  }
  .quote-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:1.1rem 1.25rem;
    position:relative;
  }
  .quote-card::before{
    content:'“';
    font-family:'Fraunces', serif;
    font-size:2.4rem;
    color:var(--rose-soft);
    position:absolute;
    top:0.1rem;
    left:0.6rem;
    line-height:1;
  }
  .quote-card p.qtext{
    margin:0.6rem 0 0.8rem;
    padding-left:0.6rem;
    font-size:0.95rem;
    color:var(--ink);
    font-style:italic;
    line-height:1.45;
  }
  .quote-card .qmeta{
    padding-left:0.6rem;
    font-size:0.78rem;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
  }

  .compare-grid{
    margin-top:1.4rem;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));
    gap:1.25rem;
  }
  .compare-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:1.5rem;
  }
  .compare-card h3{ font-size:1.15rem; margin-bottom:0.8rem; display:flex; align-items:center; gap:0.5rem; }
  .compare-card.mascota h3{ color:var(--teal); }
  .compare-card.hijos h3{ color:var(--rose); }
  .compare-card ul{ list-style:none; padding:0; margin:0; }
  .compare-card li{ padding:0.6rem 0; border-bottom:1px solid var(--line); font-size:0.92rem; color:var(--ink-soft); }
  .compare-card li:last-child{ border-bottom:none; }
  .compare-card li strong{ color:var(--ink); }

  /* ---------- Fuentes de Datos y Metodología (NUEVA SECCIÓN) ---------- */
  .sources-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1.25rem;
    margin-top: 1.4rem;
  }
  .source-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 1.35rem 1.4rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .source-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.6rem;
  }
  .source-badge {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0.25rem 0.55rem;
    border-radius: 6px;
  }
  .badge-casual { background: #E2ECE9; color: var(--teal); }
  .badge-clasico { background: #F6E7E9; color: var(--rose); }
  .badge-experto { background: #FBF0DA; color: #8A6419; }
  .badge-hardcore { background: #EAECEB; color: var(--ink-soft); }
  .source-card h4 {
    font-size: 1.05rem;
    margin-bottom:
